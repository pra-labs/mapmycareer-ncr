name: Deploy to OCI VM

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-oci.yml'
      - 'data/**'
  workflow_run:
    workflows: ["Scheduled & Merge-Triggered Job Ingestion Engine"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Next.js Standalone
        working-directory: web
        run: |
          npm ci
          npm run build
          # Copy static and public assets into standalone directory structure
          mkdir -p .next/standalone/public .next/standalone/.next/static .next/standalone/data .next/standalone/web/data
          cp -r public/* .next/standalone/public/ || true
          cp -r .next/static/* .next/standalone/.next/static/
          if [ -f data/jobs.db ]; then
            cp data/jobs.db .next/standalone/data/jobs.db
            cp data/jobs.db .next/standalone/web/data/jobs.db
          fi

      - name: Deploy to OCI via SSH/rsync
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "web/.next/standalone/"
          REMOTE_HOST: ${{ secrets.OCI_HOST }}
          REMOTE_USER: ${{ secrets.OCI_USER || 'ubuntu' }}
          TARGET: ${{ secrets.OCI_APP_DIR || '/var/www/mapmycareer' }}
          SCRIPT_AFTER: |
            sudo systemctl restart mapmycareer.service
            sudo systemctl status mapmycareer.service --no-pager
